name: Production CI/CD

on:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group test
      - run: uv run pytest -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: kevyder
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build and push production image
        run: |
          docker build -t ghcr.io/kevyder/banrepco_api:latest .
          docker push ghcr.io/kevyder/banrepco_api:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger API deployment
        run: curl -X POST "${{ secrets.DOKPLOY_API_WEBHOOK_URL }}"
      - name: Trigger Scheduler deployment
        run: curl -X POST "${{ secrets.DOKPLOY_SCHEDULER_WEBHOOK_URL }}"
